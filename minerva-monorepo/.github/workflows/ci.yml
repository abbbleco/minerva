# Minerva monorepo CI (M12 §11): automates the §12 verification gates so
# milestone criteria don't rely on a human remembering to run them.
#
#   verify   — lint + fixture eval regression (ai-core vitest) + TSX validation
#              + seed/script syntax gates. Fast feedback, no external services.
#   build    — full turborepo `pnpm build` (tsc for packages, next build for both
#              apps). Placeholder env lets static/dynamic routes compile in CI.
#   c2c-service — (C2C, M13-ready) validates the Python service *only when it
#              exists*; skipped today. CI gates it automatically once
#              services/c2c-service/ lands (C2C_IMPLEMENTATION_PLAN.md §4.1).

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.18.0"
  # Placeholders so Next builds don't need live credentials. Pages that touch
  # Supabase are request-time dynamic (cookies()), never build-time.
  SUPABASE_URL: "https://placeholder.supabase.co"
  NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"
  MINERVA_DEMO_MODE: "true"

jobs:
  verify:
    name: Verify (lint · eval fixtures · tsx · scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (turbo)
        run: pnpm lint

      - name: Eval regression dry-run on fixtures (ai-core, deterministic)
        run: pnpm --filter @minerva/ai-core test

      - name: Validate Webflow-converted TSX sections (agency-web)
        run: node .opencode/skills/webflow-to-next/scripts/validate-tsx.mjs apps/agency-web/app/sections

      - name: Seed + migration + cron scripts syntax
        run: |
          node --check packages/database/scripts/migrate.mjs
          node --check packages/database/scripts/seed.mjs
          node --check packages/database/scripts/add-operator.mjs
          node --check packages/database/scripts/verify-rls.mjs
          node --check apps/web/scripts/regression.mjs

  build:
    name: Build (full monorepo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build all (@minerva/database → @minerva/ai-core → apps)
        run: pnpm build

  # --- C2C (M13) readiness: runs only once services/c2c-service exists ---
  c2c-service:
    name: C2C service (skipped until services/c2c-service lands)
    runs-on: ubuntu-latest
    if: hashFiles('services/c2c-service/*.py', 'services/c2c-service/**') != ''
    defaults:
      run:
        working-directory: services/c2c-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Syntax compile
        run: python -m compileall -q .
      - name: Import smoke test
        run: python -c "import main"