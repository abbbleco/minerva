# Weekly regression cron (M12 §11): runs the eval harness on the §5.4 golden
# cases against the deployed app, enforces the mean-IPS gate on any prompt/model
# bump, checks §9 SLOs, and verifies the monthly AgentOps report renders
# (chargeback + PIR + autonomy ladder). Also runs manually via workflow_dispatch.
# Secrets: MINERVA_APP_URL (vars) + MINERVA_ADMIN_EMAIL/PASSWORD.
# C2C (M13): add c2c eval to regression.mjs once runC2CEval lands — the cron
# then auto-covers it (C2C_IMPLEMENTATION_PLAN.md §6.3).

name: regression

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch:

jobs:
  weekly-regression:
    name: Weekly eval + SLO regression
    runs-on: ubuntu-latest
    env:
      MINERVA_API_URL: ${{ vars.MINERVA_APP_URL || 'https://minerva-app.example.run.app' }}
      MINERVA_ADMIN_EMAIL: ${{ secrets.MINERVA_ADMIN_EMAIL }}
      MINERVA_ADMIN_PASSWORD: ${{ secrets.MINERVA_ADMIN_PASSWORD }}
      MINERVA_IPS_BASELINE: ${{ vars.MINERVA_IPS_BASELINE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run regression
        run: node apps/web/scripts/regression.mjs
      - name: Notify on failure
        if: failure()
        run: echo "::error::Weekly Minerva regression failed — see https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"